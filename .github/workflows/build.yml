name: Build PDF

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the pinned TeX Live image
        run: docker build -t tex .
      - name: Build the PDF
        run: docker run --rm -v "$PWD":/workdir tex
      # The build has no LaTeX, package, or pdfTeX warnings
      # and no overfull or underfull boxes,
      # so any such message is a regression.
      - name: Check the LaTeX log
        run: |
          if grep -n -E 'Warning|warning|Overfull|Underfull' type_theory.log | grep -v infwarerr; then
            echo "::error::type_theory.log has warnings or bad boxes (listed above)"
            exit 1
          fi
      - name: Check the BibTeX log
        run: |
          if grep -n '^Warning--' type_theory.blg; then
            echo "::error::BibTeX reported warnings (listed above)"
            exit 1
          fi
      - name: Check spelling
        run: docker run --rm -v "$PWD":/w -w /w node:22-slim npx -y cspell@8 --no-progress "**/*.tex"
      - name: Upload the PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: type_theory
          path: type_theory.pdf

  # Pushing a v* tag publishes its build as a GitHub release. The annotated
  # tag's first line is the release title; any further lines are the notes.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the PDF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: type_theory
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mv type_theory.pdf typetheory_paper.pdf
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          if [ "$(jq -r .object.type <<<"$ref")" != tag ]; then
            echo "::error::$TAG is not an annotated tag; create it with git tag -a"
            exit 1
          fi
          message=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")" -q .message)
          title=$(head -n 1 <<<"$message")
          notes=$(tail -n +2 <<<"$message" | sed '/./,$!d')
          if [ -n "$notes" ]; then
            gh release create "$TAG" typetheory_paper.pdf -R "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
          else
            gh release create "$TAG" typetheory_paper.pdf -R "$GITHUB_REPOSITORY" --title "$title" --generate-notes
          fi

  # GitHub serves release assets as downloads, which some browsers (Safari on
  # iPhone) save instead of displaying. GitHub Pages serves the latest
  # release's PDF inline, at https://jgaltidor.github.io/typetheory_paper/typetheory_paper.pdf;
  # running this workflow by hand republishes it without a new release.
  pages:
    if: >-
      !cancelled() && !failure() && (startsWith(github.ref, 'refs/tags/v')
      || github.event_name == 'workflow_dispatch')
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}typetheory_paper.pdf
    steps:
      - name: Download the latest release's PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R "$GITHUB_REPOSITORY" -p typetheory_paper.pdf -D site
          printf '<!doctype html>\n<meta charset="utf-8">\n<title>typetheory_paper.pdf</title>\n<meta http-equiv="refresh" content="0; url=typetheory_paper.pdf">\n<a href="typetheory_paper.pdf">typetheory_paper.pdf</a>\n' > site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
