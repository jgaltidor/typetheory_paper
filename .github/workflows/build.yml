name: Build PDF

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the pinned TeX Live image
        run: docker build -t tex .
      - name: Build the PDF
        run: docker run --rm -v "$PWD":/workdir tex
      # The build has no LaTeX, package, or pdfTeX warnings
      # and no overfull or underfull boxes,
      # so any such message is a regression.
      - name: Check the LaTeX log
        run: |
          if grep -n -E 'Warning|warning|Overfull|Underfull' type_theory.log | grep -v infwarerr; then
            echo "::error::type_theory.log has warnings or bad boxes (listed above)"
            exit 1
          fi
      - name: Check the BibTeX log
        run: |
          if grep -n '^Warning--' type_theory.blg; then
            echo "::error::BibTeX reported warnings (listed above)"
            exit 1
          fi
      - name: Check spelling
        run: docker run --rm -v "$PWD":/w -w /w node:22-slim npx -y cspell@8 --no-progress "**/*.tex"
      - name: Upload the PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: type_theory
          path: type_theory.pdf
